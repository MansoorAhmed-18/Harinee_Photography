<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery Debug - All Images</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      padding: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: #222;
      border: 1px solid #333;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    img {
      max-width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    h3 {
      margin: 5px 0;
      font-size: 14px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>Gallery Debug - All Images</h1>
  <div class="grid">
    <!-- Non-insta images -->
    <div class="card"><img src="/images/about_portrait.png" /><h3>about_portrait.png</h3></div>
    <div class="card"><img src="/images/portfolio_baby.png" /><h3>portfolio_baby.png</h3></div>
    <div class="card"><img src="/images/portfolio_prewedding.png" /><h3>portfolio_prewedding.png</h3></div>
    <div class="card"><img src="/images/portfolio_wedding.png" /><h3>portfolio_wedding.png</h3></div>
    <div class="card"><img src="/images/wedding_hero_1.png" /><h3>wedding_hero_1.png</h3></div>
    <div class="card"><img src="/images/wedding_hero_2.png" /><h3>wedding_hero_2.png</h3></div>
    <div class="card"><img src="/images/wedding_hero_3.png" /><h3>wedding_hero_3.png</h3></div>
    
    <!-- Instagram feed ones -->
    <div class="card"><img src="/images/instagram_1.jpg" /><h3>instagram_1.jpg</h3></div>
    <div class="card"><img src="/images/instagram_2.jpg" /><h3>instagram_2.jpg</h3></div>
    <div class="card"><img src="/images/instagram_3.jpg" /><h3>instagram_3.jpg</h3></div>
    <div class="card"><img src="/images/instagram_4.jpg" /><h3>instagram_4.jpg</h3></div>
    <div class="card"><img src="/images/instagram_5.jpg" /><h3>instagram_5.jpg</h3></div>
    <div class="card"><img src="/images/instagram_6.jpg" /><h3>instagram_6.jpg</h3></div>
  </div>
</body>
</html>
