<!DOCTYPE html>

    body {
      background: #111;

      font-family: sans-serif;
      padding: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background: #222;

      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    img {
      max-width: 100%;
      height: 350px;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    h3 {
      margin: 5px 0;
      font-size: 14px;
      word-break: break-all;
    }
  </style>
</head>
<body>
